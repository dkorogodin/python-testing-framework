# To execute this docker compose yml file use `docker compose -f data/docker/docker-compose-selenium-grid.yml up -d`
# Add the `-d` flag at the end for detached execution
# To stop the execution, hit Ctrl+C, and then `docker compose -f data/docker/docker-compose-selenium-grid.yml down`
services:
  selenium-hub:
    image: "selenium/hub"
    ports:
      - "4442:4442"
      - "4443:4443"
      - "4444:4444"

  chrome:
    image: "selenium/node-chrome"
    shm_size: "2gb"
    platform: linux/x86_64
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=8
      - VNC_NO_PASSWORD=1
    ports:
      - "6900:5900"

  firefox:
    image: "selenium/node-firefox"
    shm_size: 2gb
    platform: linux/x86_64
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=8
      - VNC_NO_PASSWORD=1
    ports:
      - "6902:5900"